<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SEO Meta Tags -->
    <title>Time Talk | Dialogue with Historical Figures | LLM Interactive Teaching Platform</title>
    <meta
      name="description"
      content="A revolutionary history teaching platform that enables first-person dialogue learning between students and historical figures. Based on LLM technology, providing immersive interactive experience, suitable for junior and senior high school history teaching. Free trial, educational licensing discounts available."
    />
    <meta
      name="keywords"
      content="history dialogue, first-person, teaching model, React, LLM, Qin Shi Huang, interactive teaching, history education, AI teaching"
    />
    <meta name="author" content="Time Talk" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Time Talk | Dialogue with Historical Figures to Learn History" />
    <meta
      property="og:description"
      content="A revolutionary history teaching platform enabling first-person dialogue learning between students and historical figures. An immersive interactive experience based on LLM technology."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://history-chat.example.com" />
    <meta property="og:image" content="<IMG_PLACEHOLDER>" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Time Talk | Dialogue with Historical Figures to Learn History" />
    <meta
      name="twitter:description"
      content="A revolutionary history teaching platform enabling first-person dialogue learning between students and historical figures."
    />
    <meta name="twitter:image" content="<IMG_PLACEHOLDER>" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Time Talk - Historical Dialogue System",
        "url": "https://history-chat.example.com",
        "description": "A revolutionary history teaching platform enabling first-person dialogue learning between students and historical figures",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://history-chat.example.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Time Talk - Historical Dialogue System",
        "description": "An interactive history teaching platform based on LLM technology",
        "brand": {
          "@type": "Brand",
          "name": "Time Talk"
        },
        "offers": {
          "@type": "Offer",
          "priceCurrency": "TWD",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>

    <!-- Accessibility -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <div id="root"></div>
