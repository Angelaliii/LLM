<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>樣式測試頁面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#FDF7ED",
                100: "#FAECC0",
                500: "#C6A15B",
                600: "#B8935A",
                700: "#A6834F",
              },
              dark: {
                900: "#1B1B1D",
                800: "#2A2A2D",
                700: "#4A4A4F",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 font-sans">
    <div class="max-w-4xl mx-auto p-8">
      <h1 class="text-4xl font-bold text-dark-900 mb-8">樣式系統測試</h1>

      <!-- 顏色測試 -->
      <section class="mb-12">
        <h2 class="text-2xl font-semibold text-dark-900 mb-4">主要顏色</h2>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
          <div class="text-center">
            <div class="w-20 h-20 bg-primary-500 rounded-lg mx-auto mb-2"></div>
            <p class="text-sm">Primary 500</p>
          </div>
          <div class="text-center">
            <div class="w-20 h-20 bg-primary-600 rounded-lg mx-auto mb-2"></div>
            <p class="text-sm">Primary 600</p>
          </div>
          <div class="text-center">
            <div class="w-20 h-20 bg-dark-900 rounded-lg mx-auto mb-2"></div>
            <p class="text-sm">Dark 900</p>
          </div>
          <div class="text-center">
            <div class="w-20 h-20 bg-dark-800 rounded-lg mx-auto mb-2"></div>
            <p class="text-sm">Dark 800</p>
          </div>
          <div class="text-center">
            <div class="w-20 h-20 bg-gray-200 rounded-lg mx-auto mb-2"></div>
            <p class="text-sm">Gray 200</p>
          </div>
        </div>
      </section>

      <!-- 按鈕測試 -->
      <section class="mb-12">
        <h2 class="text-2xl font-semibold text-dark-900 mb-4">按鈕樣式</h2>
        <div class="space-x-4">
          <button
            class="bg-primary-500 hover:bg-primary-600 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200"
          >
            主要按鈕
          </button>
          <button
            class="bg-transparent border-2 border-primary-500 text-primary-500 hover:bg-primary-500 hover:text-white px-6 py-3 rounded-lg font-medium transition-all duration-200"
          >
            次要按鈕
          </button>
        </div>
      </section>

      <!-- 卡片測試 */
        <section class="mb-12">
            <h2 class="text-2xl font-semibold text-dark-900 mb-4">卡片樣式</h2>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="bg-white rounded-xl shadow-lg p-6 transition-transform duration-200 hover:scale-105">
                    <h3 class="text-xl font-semibold text-dark-900 mb-3">卡片標題</h3>
                    <p class="text-dark-700">這是一個測試卡片，用來驗證樣式系統是否正常工作。</p>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6 transition-transform duration-200 hover:scale-105">
                    <h3 class="text-xl font-semibold text-dark-900 mb-3">另一個卡片</h3>
                    <p class="text-dark-700">卡片應該有陰影效果和懸停動畫。</p>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6 transition-transform duration-200 hover:scale-105">
                    <h3 class="text-xl font-semibold text-dark-900 mb-3">第三個卡片</h3>
                    <p class="text-dark-700">所有卡片應該保持一致的樣式。</p>
                </div>
            </div>
        </section>

        <!-- 漸變背景測試 -->
      <section class="mb-12">
        <div
          class="bg-gradient-to-br from-primary-50 via-white to-primary-100 p-8 rounded-xl"
        >
          <h2 class="text-2xl font-semibold text-dark-900 mb-4">
            漸變背景測試
          </h2>
          <p class="text-dark-700">
            這個區塊使用了漸變背景，從淺色到白色再到另一個淺色。
          </p>
        </div>
      </section>
    </div>
  </body>
</html>
